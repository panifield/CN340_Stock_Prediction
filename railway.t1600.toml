"$schema" = "https://railway.com/railway.schema.json"

# service "t1600" -- จันทร์-ศุกร์ ลอง 3 รอบ 16:02, 16:12, 16:22 น. ไทย (UTC 09:02, 09:12, 09:22)
# ต้องเริ่มภายใน 16:00-16:29 (task_b ปฏิเสธนอกช่วงนี้ และ deploy/railway_run.sh เช็คซ้ำก่อนเริ่ม)
# Railway อาจเริ่มช้าได้ไม่กี่นาที ถ้ารอบแรกพลาด (เช่น Yahoo ยังไม่มีแท่ง 15:00) รอบถัดไปลองใหม่ได้
# ทำเสร็จครบทุก task แล้วรอบหลัง ๆ ข้ามเอง (deploy/precheck.py) · ถ้า task_a2 เขียนไปแล้วแต่ task ถัดไปล้ม
# รอบถัดไปจะหยุดและรายงาน "ทำไปแล้วบางส่วน" (exit 5) ให้คนดู -- ไม่รันซ้ำเอง
#
# ใช้กับ service ที่สอง: Settings -> Config-as-code -> ใส่ path เป็น  /railway.t1600.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash /usr/local/bin/railway_run.sh t1600"
cronSchedule = "2,12,22 9 * * 1-5"
restartPolicyType = "NEVER"
