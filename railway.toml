"$schema" = "https://railway.com/railway.schema.json"

# service เดียวรับทั้งสองงาน: startCommand ใช้โหมด auto (deploy/railway_run.sh เลือกงานตามเวลาไทย)
#   08:00-09:59 น. -> next_day (ลองซ้ำได้หลายรอบ ถ้า Yahoo ยังไม่มี Close ของวันก่อนหน้า จะจบเงียบรอรอบถัดไป)
#   16:00-16:29 น. -> t1600
#   เวลาอื่น      -> จบใน 2-3 วินาที ไม่ทำอะไร (รวมถึงตอน deploy/redeploy จึงไม่เผลอรันงานจริงผิดเวลา)
#
# cron เป็นเวลา UTC: ทุก 10 นาทีใน UTC 01:xx 02:xx 09:xx = 08:02-09:52 และ 16:02-16:52 น. ไทย (จันทร์-ศุกร์)
# Railway ไม่การันตีนาทีที่เริ่ม (คลาดได้ไม่กี่นาที) และถ้ารอบก่อนยังไม่จบ รอบถัดไปจะถูกข้าม · ห่างกันขั้นต่ำ 5 นาที
# รอบที่อยู่นอกช่วงงาน (เช่น 16:32, 16:42, 16:52) จบเองทันที
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# deploy ใหม่เฉพาะเมื่อไฟล์ที่ฝังใน image เปลี่ยนเท่านั้น (ดู Dockerfile: image มีแค่ library + railway_run.sh โค้ดโปรเจกต์ clone สดตอนรัน)
# ไม่งั้นทุกครั้งที่ bot push log (เช่น task_a ตอน 08:04) Railway จะ deploy ใหม่ แล้วปิด deployment ที่กำลังรันอยู่ทิ้งกลางทาง
# -> task_b ไม่ถูกรัน ได้ log ครึ่งเดียว (เกิดจริง 2026-10-15)
watchPatterns = [
  "Dockerfile",
  "railway.toml",
  "requirements.txt",
  "task_b/requirements.txt",
  "task_b/requirements-live.txt",
  "deploy/railway_run.sh",
]

[deploy]
startCommand = "bash /usr/local/bin/railway_run.sh auto"
cronSchedule = "2,12,22,32,42,52 1,2,9 * * 1-5"
# ไม่ retry อัตโนมัติ: งานนี้เขียน log + push ทีละขั้น รันซ้ำเองอาจชน guard กันทำนายซ้ำ/ได้ log ครึ่ง ๆ
restartPolicyType = "NEVER"
