"$schema" = "https://railway.com/railway.schema.json"

# service "next_day" -- งานเช้า 08:30 น. ไทย (= 01:30 UTC) จันทร์-ศุกร์
# Railway cron ใช้เวลา UTC และ "ไม่การันตีนาทีที่เริ่ม อาจคลาดได้ไม่กี่นาที"
# (งาน t1600 ใช้ไฟล์ railway.t1600.toml -- ต้องสร้างอีก service แล้วชี้ไฟล์นั้นใน Settings)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash /usr/local/bin/railway_run.sh next_day"
cronSchedule = "30 1 * * 1-5"
# ไม่ retry อัตโนมัติ: งานนี้เขียน log + push ทีละขั้น รันซ้ำเองอาจชน guard กันทำนายซ้ำ/ได้ log ครึ่ง ๆ
restartPolicyType = "NEVER"
